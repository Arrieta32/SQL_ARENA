name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Vite sustituye import.meta.env.VITE_* SOLO aquí.
      # El contenedor de Azure/static-web-apps-deploy NO hereda bien el env del step;
      # por eso construimos fuera y usamos skip_app_build.
      - name: Verificar secrets del webhook
        env:
          VITE_GOOGLE_WEBHOOK_URL: ${{ secrets.VITE_GOOGLE_WEBHOOK_URL }}
          VITE_WEBHOOK_SECRET: ${{ secrets.VITE_WEBHOOK_SECRET }}
        run: |
          if [ -z "$VITE_GOOGLE_WEBHOOK_URL" ]; then
            echo "::error::Falta el secret de GitHub Actions 'VITE_GOOGLE_WEBHOOK_URL'."
            echo "No uses Application Settings del portal Azure para el frontend Vite."
            echo "Crealo en: Repo → Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi
          if [ -z "$VITE_WEBHOOK_SECRET" ]; then
            echo "::error::Falta el secret de GitHub Actions 'VITE_WEBHOOK_SECRET'."
            exit 1
          fi
          echo "Secrets OK (URL length=${#VITE_GOOGLE_WEBHOOK_URL}, token length=${#VITE_WEBHOOK_SECRET})"

      - name: Build (Vite con env)
        env:
          VITE_GOOGLE_WEBHOOK_URL: ${{ secrets.VITE_GOOGLE_WEBHOOK_URL }}
          VITE_WEBHOOK_SECRET: ${{ secrets.VITE_WEBHOOK_SECRET }}
        run: npm run build

      - name: Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WONDERFUL_BUSH_06C2AAB1E }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: 'dist'
          api_location: ''
          output_location: ''
          skip_app_build: true

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WONDERFUL_BUSH_06C2AAB1E }}
          action: 'close'
